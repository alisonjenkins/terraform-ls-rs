name: action-test

# Self-test for the composite `tfls-lint` GitHub Action (action.yml at the
# repo root). Exercises it against a known release tag so a change to
# action.yml is caught before it reaches users pinning
# `uses: alisonjenkins/terraform-ls-rs@vX.Y.Z`.
on:
  pull_request:
    paths:
      - "action.yml"
      - ".github/workflows/action-test.yml"

permissions:
  contents: read

jobs:
  test-ubuntu:
    name: action / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run tfls-lint action (SARIF pass)
        uses: ./
        with:
          version: v0.17.0
          paths: crates/tfls-engine/tests/fixtures/basic
          schemas: none
          offline: "true"
          fail-on: never
          sarif-file: out/tfls.sarif

      - name: Assert SARIF file was written
        shell: bash
        run: |
          set -euo pipefail
          test -f out/tfls.sarif
          jq -e '.version == "2.1.0"' out/tfls.sarif

      - name: Run tfls-lint action (fail-on warning)
        id: warn
        uses: ./
        continue-on-error: true
        with:
          version: v0.17.0
          paths: crates/tfls-engine/tests/fixtures/basic
          schemas: none
          offline: "true"
          fail-on: warning

      - name: Assert non-zero exit was surfaced
        shell: bash
        env:
          EXIT_CODE: ${{ steps.warn.outputs.exit-code }}
        run: |
          set -euo pipefail
          if [ "$EXIT_CODE" != "1" ]; then
            echo "::error::expected exit-code output '1', got '${EXIT_CODE}'" >&2
            exit 1
          fi

  test-windows:
    name: action / windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run tfls-lint action (SARIF pass)
        uses: ./
        with:
          version: v0.17.0
          paths: crates/tfls-engine/tests/fixtures/basic
          schemas: none
          offline: "true"
          fail-on: never
          sarif-file: out/tfls.sarif

      - name: Assert SARIF file was written
        shell: bash
        run: |
          set -euo pipefail
          test -f out/tfls.sarif
          jq -e '.version == "2.1.0"' out/tfls.sarif

      - name: Run tfls-lint action (fail-on warning)
        id: warn
        uses: ./
        continue-on-error: true
        with:
          version: v0.17.0
          paths: crates/tfls-engine/tests/fixtures/basic
          schemas: none
          offline: "true"
          fail-on: warning

      - name: Assert non-zero exit was surfaced
        shell: bash
        env:
          EXIT_CODE: ${{ steps.warn.outputs.exit-code }}
        run: |
          set -euo pipefail
          if [ "$EXIT_CODE" != "1" ]; then
            echo "::error::expected exit-code output '1', got '${EXIT_CODE}'" >&2
            exit 1
          fi
